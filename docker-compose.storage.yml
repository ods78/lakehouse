# =============================================================================
# LakeHouse — Phase 3: STORAGE & HOT TIER
# Ceph (MON + MGR + OSD + RGW/S3) = lake storage for Iceberg/CDC/MLflow/etc.
# ClickHouse = hot tier with TTL offload of cold data to Ceph S3.
# Requires ./lakehouse.sh bootstrap-ceph after first up (S3 user + buckets).
# =============================================================================
volumes:
  ceph-config:
  ceph-mon-data:
  ceph-mgr-data:
  ceph-osd-data:
  ceph-rgw-data:
  ceph-bootstrap:
  clickhouse-data:
  clickhouse-logs:

services:
  ceph-mon:
    image: ${CEPH_IMAGE}
    container_name: lakehouse-ceph-mon
    restart: unless-stopped
    command: ["mon"]
    environment:
      MON_IP: ${CEPH_MON_IP}
      CEPH_PUBLIC_NETWORK: ${LAKEHOUSE_SUBNET}
      CEPH_CLUSTER_NETWORK: ${LAKEHOUSE_SUBNET}
      TZ: ${TZ}
    networks:
      lakehouse:
        ipv4_address: ${CEPH_MON_IP}
    volumes:
      - ceph-mon-data:/var/lib/ceph
      - ceph-config:/etc/ceph

  ceph-mgr:
    image: ${CEPH_IMAGE}
    container_name: lakehouse-ceph-mgr
    restart: unless-stopped
    command: ["mgr"]
    environment:
      CEPH_PUBLIC_NETWORK: ${LAKEHOUSE_SUBNET}
      TZ: ${TZ}
    networks:
      lakehouse:
        ipv4_address: ${CEPH_MGR_IP}
    volumes:
      - ceph-mgr-data:/var/lib/ceph
      - ceph-config:/etc/ceph
    depends_on:
      - ceph-mon

  # Directory-backed OSD (filestore). The bootstrap script pre-creates
  # osd.0 (keyring + mkfs) inside ceph-osd-data before this container runs.
  ceph-osd:
    image: ${CEPH_IMAGE}
    container_name: lakehouse-ceph-osd
    restart: unless-stopped
    command: ["osd_directory_single"]
    environment:
      TZ: ${TZ}
    privileged: true
    networks:
      lakehouse:
        ipv4_address: ${CEPH_OSD_IP}
    volumes:
      - ceph-osd-data:/var/lib/ceph/osd
      - ceph-config:/etc/ceph
    depends_on:
      - ceph-mon

  ceph-rgw:
    image: ${CEPH_IMAGE}
    container_name: lakehouse-ceph-rgw
    restart: unless-stopped
    command: ["rgw"]
    environment:
      RGW_CIVETWEB_PORT: "8080"
      RGW_NAME: lakehouse
      TZ: ${TZ}
    networks:
      lakehouse:
        ipv4_address: ${CEPH_RGW_IP}
    volumes:
      - ceph-rgw-data:/var/lib/ceph/radosgw
      - ceph-bootstrap:/var/lib/ceph/bootstrap-rgw
      - ceph-config:/etc/ceph
    ports:
      - "${CEPH_RGW_HOST_PORT}:8080"
    depends_on:
      - ceph-mon
      - ceph-osd

  # Hot tier. Cold rows TTL-offloaded to the s3_cold disk (config.d/storage.xml)
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: lakehouse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      TZ: ${TZ}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${CLICKHOUSE_HTTP_HOST_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_HOST_PORT}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./storage/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./storage/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      - ceph-rgw
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - lakehouse
