services:
  mssql:
    profiles: [sources]
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION}
    container_name: lh-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"   # required for CDC
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [mssql-data:/var/opt/mssql]
    networks: [lh_sources]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mssql-init:   # seeds schema + enables CDC (idempotent)
    profiles: [sources]
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION}
    depends_on: {mssql: {condition: service_healthy}}
    environment: {MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"}
    volumes: ["./init/sqlserver/seed.sql:/seed.sql:ro"]
    networks: [lh_sources]
    entrypoint: ["/bin/sh","-c"]
    command: ["/opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -i /seed.sql"]
    restart: "no"
