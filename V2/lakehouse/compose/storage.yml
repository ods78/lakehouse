services:
  s3:   # DEV stand-in for Ceph RGW. Same contract: S3_ENDPOINT + path-style + keys. Prod = RGW VIP.
    profiles: [storage]
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    container_name: lh-s3
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"lake","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=100
    ports: ["8333:8333"]
    volumes: [s3-data:/data]
    networks: [lh_storage, lh_ingestion]
    restart: unless-stopped

  s3-bootstrap:   # bucket + prefix conventions: iceberg/ cdc/ mlflow/ landing/ clickhouse-cold/
    profiles: [storage]
    image: amazon/aws-cli
    depends_on: [s3]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
    networks: [lh_storage]
    entrypoint: ["/bin/sh","-c"]
    command:
      - |
        until aws --endpoint-url ${S3_ENDPOINT} s3 ls >/dev/null 2>&1; do echo waiting for s3; sleep 3; done
        aws --endpoint-url ${S3_ENDPOINT} s3 mb s3://${S3_BUCKET} 2>/dev/null || true
        for p in iceberg cdc mlflow landing clickhouse-cold; do
          aws --endpoint-url ${S3_ENDPOINT} s3api put-object --bucket ${S3_BUCKET} --key $$p/ >/dev/null
        done
        echo bucket ready
    restart: "no"

  clickhouse:   # hot tier, S3 cold volume via storage policy hot_cold
    profiles: [storage]
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: lh-clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["8123:8123","9000:9000"]
    ulimits: {nofile: {soft: 262144, hard: 262144}}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./config/clickhouse/storage.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
    networks: [lh_storage, lh_ingestion]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  iceberg-rest:   # DEV catalog (image is unmaintained); swap to Lakekeeper/Polaris before prod
    profiles: [storage]
    image: tabulario/iceberg-rest:${ICEBERG_REST_VERSION}
    container_name: lh-iceberg-rest
    depends_on: {postgres: {condition: service_healthy}}
    environment:
      CATALOG_WAREHOUSE: s3://${S3_BUCKET}/iceberg/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: ${S3_ENDPOINT}
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_URI: jdbc:postgresql://postgres:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: ${PG_ICEBERG_PASSWORD}
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: ${S3_REGION}
    ports: ["8181:8181"]
    networks: [lh_storage]
    restart: unless-stopped
