services:
  kafka:   # KRaft single node, no ZooKeeper
    profiles: [ingestion]
    image: apache/kafka:${KAFKA_VERSION}
    container_name: lh-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [lh_ingestion]
    restart: unless-stopped

  schema-registry:   # Apicurio, Confluent-compatible API at /apis/ccompat/v7
    profiles: [ingestion]
    image: apicurio/apicurio-registry-mem:${APICURIO_VERSION}
    container_name: lh-schema-registry
    ports: ["8081:8080"]
    networks: [lh_ingestion]
    restart: unless-stopped

  connect:   # Debezium
    profiles: [ingestion]
    image: quay.io/debezium/connect:${DEBEZIUM_VERSION}
    container_name: lh-connect
    depends_on: [kafka]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lh-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: ["8083:8083"]
    networks: [lh_ingestion, lh_sources]
    restart: unless-stopped

  kafka-ui:
    profiles: [ingestion]
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: lh-kafka-ui
    depends_on: [kafka]
    environment:
      KAFKA_CLUSTERS_0_NAME: lh
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports: ["8085:8080"]
    networks: [lh_ingestion]
    restart: unless-stopped

  nifi:   # batch / files / API -> S3 landing zone (s3://lake/landing/)
    profiles: [ingestion]
    image: apache/nifi:${NIFI_VERSION}
    container_name: lh-nifi
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_SENSITIVE_PROPS_KEY: ${NIFI_SENSITIVE_KEY}
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 2g
    ports: ["8443:8443"]
    volumes:
      - nifi-state:/opt/nifi/nifi-current/state
      - ./fixtures/sample-files:/opt/nifi/fixtures:ro
    networks: [lh_ingestion, lh_sources, lh_storage]
    restart: unless-stopped
