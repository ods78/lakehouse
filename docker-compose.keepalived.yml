# =============================================================================
# LakeHouse — optional overlay: Keepalived VRRP (multi-host HA for HAProxy).
# Single-host stacks don't need this (nothing to fail over to).
# Start with: ./lakehouse.sh up ops-ha
# =============================================================================
services:
  keepalived:
    image: osixia/keepalived:2.0.20
    container_name: lakehouse-keepalived
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    network_mode: host
    volumes:
      - ./ops/keepalived/keepalived.conf:/usr/local/etc/keepalived/keepalived.conf:ro
    command: ["keepalived", "-n", "-l", "-", "-f", "/usr/local/etc/keepalived/keepalived.conf"]
