# StarRocks FE (front end) — single node
meta_dir = /opt/starrocks/fe/meta

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# Match the LakeHouse docker network so FE advertises the right IP
priority_networks = 172.31.100.0/24

JAVA_OPTS = -Dfe.meta_dir=/opt/starrocks/fe/meta -Xmx2048m -XX:+UseG1GC
LOG_DIR = /opt/starrocks/fe/log
