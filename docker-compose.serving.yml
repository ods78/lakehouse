# =============================================================================
# LakeHouse — Phase 6: SERVING
# Trino 476 (ad-hoc/federated SQL over Iceberg via REST catalog)
# StarRocks 3.3 (concurrent OLAP + materialized views)
# =============================================================================
volumes:
  starrocks-fe-meta:
  starrocks-be-storage:

services:
  trino:
    image: trinodb/trino:${TRINO_VERSION}
    container_name: lakehouse-trino
    restart: unless-stopped
    ports:
      - "${TRINO_HOST_PORT}:8080"
    volumes:
      - ./serving/trino/etc:/etc/trino:ro
    depends_on:
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - lakehouse

  starrocks-fe:
    image: starrocks/fe-ubuntu:${STARROCKS_VERSION}
    container_name: lakehouse-starrocks-fe
    # k8s-style hostname: the entrypoint parses a pod index from it
    hostname: starrocks-fe-0
    restart: unless-stopped
    # Image ships no default entrypoint — the k8s-style script handles
    # leader probing; with one FE it becomes the leader itself.
    entrypoint: ["/opt/starrocks/fe_entrypoint.sh", "starrocks-fe"]
    ports:
      - "${STARROCKS_MYSQL_HOST_PORT}:9030"
      - "${STARROCKS_HTTP_HOST_PORT}:8030"
    volumes:
      - starrocks-fe-meta:/opt/starrocks/fe/meta
      - ./serving/starrocks/fe.conf:/opt/starrocks/fe/conf/fe.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8030/api/bootstrap || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 120s
    networks:
      - lakehouse

  starrocks-be:
    image: starrocks/be-ubuntu:${STARROCKS_VERSION}
    container_name: lakehouse-starrocks-be
    hostname: starrocks-be-0
    restart: unless-stopped
    # Self-registers with the FE (ALTER SYSTEM ADD BACKEND) then starts.
    entrypoint: ["/opt/starrocks/be_entrypoint.sh", "starrocks-fe"]
    volumes:
      - starrocks-be-storage:/opt/starrocks/be/storage
      - ./serving/starrocks/be.conf:/opt/starrocks/be/conf/be.conf:ro
    depends_on:
      starrocks-fe:
        condition: service_healthy
    networks:
      - lakehouse
