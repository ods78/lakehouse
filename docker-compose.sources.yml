# =============================================================================
# LakeHouse — Phase 1: SOURCES
# SQL Server 2022 as the operational source (CDC-enabled for Debezium).
# The CDC bootstrap SQL is applied with: ./lakehouse.sh seed-mssql
# =============================================================================
volumes:
  mssql-data:

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION}
    container_name: lakehouse-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_AGENT_ENABLED: "true"     # required for SQL Server CDC
      TZ: ${TZ}
    ports:
      - "${MSSQL_HOST_PORT}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ./sources/mssql/init:/lakehouse-init:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - lakehouse
