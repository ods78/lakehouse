# Optional: enable with `./lakehouse.sh up ops-ha` when running TWO hosts.
# Single-host deployments keep this disabled (see README in this folder).
global_defs {
  router_id lakehouse_ha_1
}

vrrp_script check_haproxy {
  script "killall -0 haproxy"
  interval 2
  weight 2
  fall 2
  rise 2
}

vrrp_instance VI_LAKEHOUSE {
  state MASTER              # set BACKUP on the standby host
  interface eth0
  virtual_router_id 51
  priority 100              # lower (e.g. 90) on the standby host
  advert_int 1
  virtual_ipaddress {
    172.31.100.250/24       # floating VIP in front of HAProxy
  }
  track_script {
    check_haproxy
  }
}
