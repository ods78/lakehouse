# =============================================================================
# LakeHouse edge entrypoint — host-name based routing on port ${HAPROXY_HTTP_HOST_PORT}
# Add to /etc/hosts (or your DNS):
#   <host-ip> superset.lakehouse.local airflow.lakehouse.local nifi.lakehouse.local
#            jupyter.lakehouse.local mlflow.lakehouse.local keycloak.lakehouse.local
#            metadata.lakehouse.local grafana.lakehouse.local trino.lakehouse.local
#            clickhouse.lakehouse.local vault.lakehouse.local starrocks.lakehouse.local
#            kafka-ui.lakehouse.local rgw.lakehouse.local
# (./lakehouse.sh hosts does this for you — requires sudo)
# =============================================================================
global
  log stdout format raw local0
  maxconn 2000

defaults
  log     global
  mode    http
  option  httplog
  option  dontlognull
  # don't fail startup when a backend container isn't resolvable yet
  default-server init-addr last,libc,none
  timeout connect 10s
  timeout client  300s
  timeout server  300s
  retries 3

frontend fe_lakehouse
  bind *:80

  acl host_superset   hdr(host) -i superset.lakehouse.local
  acl host_airflow    hdr(host) -i airflow.lakehouse.local
  acl host_nifi       hdr(host) -i nifi.lakehouse.local
  acl host_jupyter    hdr(host) -i jupyter.lakehouse.local
  acl host_mlflow     hdr(host) -i mlflow.lakehouse.local
  acl host_keycloak   hdr(host) -i keycloak.lakehouse.local
  acl host_metadata   hdr(host) -i metadata.lakehouse.local
  acl host_grafana    hdr(host) -i grafana.lakehouse.local
  acl host_trino      hdr(host) -i trino.lakehouse.local
  acl host_clickhouse hdr(host) -i clickhouse.lakehouse.local
  acl host_vault      hdr(host) -i vault.lakehouse.local
  acl host_starrocks  hdr(host) -i starrocks.lakehouse.local
  acl host_kafkaui    hdr(host) -i kafka-ui.lakehouse.local
  acl host_rgw        hdr(host) -i rgw.lakehouse.local

  use_backend be_superset   if host_superset
  use_backend be_airflow    if host_airflow
  use_backend be_nifi       if host_nifi
  use_backend be_jupyter    if host_jupyter
  use_backend be_mlflow     if host_mlflow
  use_backend be_keycloak   if host_keycloak
  use_backend be_metadata   if host_metadata
  use_backend be_grafana    if host_grafana
  use_backend be_trino      if host_trino
  use_backend be_clickhouse if host_clickhouse
  use_backend be_vault      if host_vault
  use_backend be_starrocks  if host_starrocks
  use_backend be_kafkaui    if host_kafkaui
  use_backend be_rgw        if host_rgw

  default_backend be_404

backend be_superset
  server superset superset:8088 check

backend be_airflow
  server airflow airflow-webserver:8080 check

backend be_nifi
  server nifi nifi:8443 check ssl verify none

backend be_jupyter
  server jupyter jupyterhub:8000 check

backend be_mlflow
  server mlflow mlflow:5000 check

backend be_keycloak
  server keycloak keycloak:8080 check

backend be_metadata
  server metadata openmetadata-server:8585 check

backend be_grafana
  server grafana grafana:3000 check

backend be_trino
  server trino trino:8080 check

backend be_clickhouse
  server clickhouse clickhouse:8123 check

backend be_vault
  server vault vault:8200 check

backend be_starrocks
  server starrocks starrocks-fe:8030 check

backend be_kafkaui
  server kafkaui kafka-ui:8080 check

backend be_rgw
  server rgw ceph-rgw:8080 check

backend be_404
  http-request return status 404 content-type text/html string "<html><body>LakeHouse: unknown host</body></html>"
