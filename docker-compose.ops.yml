# =============================================================================
# LakeHouse — Phase 8: CROSS-CUTTING OPS
# Vault | Keycloak SSO | OpenMetadata (+OpenSearch) | Prometheus + Grafana + Loki
# OPA policies | HAProxy edge entrypoint (+ optional Keepalived, single-host note)
# =============================================================================
volumes:
  vault-data:
  prometheus-data:
  grafana-data:
  loki-data:
  openmetadata-search-data:

services:
  # Secrets management — initialized with: ./lakehouse.sh vault-init
  vault:
    image: hashicorp/vault:${VAULT_VERSION}
    container_name: lakehouse-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    # ensure the data dir is writable (named volume comes root-owned from
    # the image), then exec the server
    command: ["sh", "-c", "chown -R vault:vault /vault/data 2>/dev/null; exec vault server -config=/vault/etc/config.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      TZ: ${TZ}
    ports:
      - "${VAULT_HOST_PORT}:8200"
    volumes:
      - vault-data:/vault/data
      # NOTE: must NOT live under /vault/config — Vault auto-loads that dir
      # and would bind the listener twice ("address already in use")
      - ./ops/vault/config.hcl:/vault/etc/config.hcl:ro
    networks:
      - lakehouse

  # SSO for Superset / Airflow / NiFi / Jupyter / Grafana / OpenMetadata
  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION}
    container_name: lakehouse-keycloak
    restart: unless-stopped
    command: >
      start --import-realm
      --bootstrap-admin-username ${KEYCLOAK_ADMIN_USER}
      --bootstrap-admin-password ${KEYCLOAK_ADMIN_PASSWORD}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://lakehouse-postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      TZ: ${TZ}
    ports:
      - "${KEYCLOAK_HOST_PORT}:8080"
    volumes:
      - ./ops/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
    networks:
      - lakehouse

  # Metadata catalog / data discovery
  openmetadata-search:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION}
    container_name: lakehouse-openmetadata-search
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms1G -Xmx1G
      bootstrap.memory_lock: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: lakehouse-change-me
    volumes:
      - openmetadata-search-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - lakehouse

  # DB migrations must complete before the server starts (the server does not
  # self-migrate — it fails on missing tables otherwise)
  openmetadata-migrate:
    image: openmetadata/server:${OPENMETADATA_VERSION}
    container_name: lakehouse-openmetadata-migrate
    restart: "no"
    environment: &om-env
      OPENMETADATA_CLUSTER_NAME: lakehouse
      SERVER_PORT: "8585"
      SERVER_ADMIN_PORT: "8586"
      LOG_LEVEL: INFO
      AUTHORIZER_CLASS_NAME: org.openmetadata.service.security.DefaultAuthorizer
      AUTHORIZER_REQUEST_FILTER: org.openmetadata.service.security.JwtFilter
      AUTHORIZER_ADMIN_PRINCIPALS: '[admin]'
      AUTHORIZER_INGESTION_PRINCIPALS: '[ingestion-bot]'
      AUTHORIZER_PRINCIPAL_DOMAIN: open-metadata.org
      AUTHENTICATION_PROVIDER: basic
      AUTHENTICATION_RESPONSE_TYPE: id_token
      AUTHENTICATION_PUBLIC_KEYS: '[http://localhost:8585/api/v1/system/config/jwks]'
      AUTHENTICATION_AUTHORITY: https://accounts.google.com
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_USER: ${POSTGRES_USER}
      DB_USER_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: lakehouse-postgres
      DB_PORT: "5432"
      OM_DATABASE: openmetadata_db
      ELASTICSEARCH_HOST: openmetadata-search
      ELASTICSEARCH_PORT: "9200"
      ELASTICSEARCH_SCHEME: http
      SEARCH_TYPE: opensearch
      ELASTICSEARCH_CLUSTER_ALIAS: openmetadata
      EVENT_MONITOR: prometheus
      PIPELINE_SERVICE_CLIENT_CLASS_NAME: org.openmetadata.service.clients.pipeline.airflow.AirflowRESTClient
      PIPELINE_SERVICE_CLIENT_ENDPOINT: http://airflow-webserver:8080/api
      AIRFLOW_USERNAME: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      SECRET_MANAGER: db
      OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G
      TZ: ${TZ}
    command: ["/opt/openmetadata/bootstrap/openmetadata-ops.sh", "migrate"]
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
    networks:
      - lakehouse

  openmetadata-server:
    image: openmetadata/server:${OPENMETADATA_VERSION}
    container_name: lakehouse-openmetadata-server
    restart: unless-stopped
    environment: *om-env
    ports:
      - "${OPENMETADATA_HOST_PORT}:8585"
    depends_on:
      lakehouse-postgres:
        condition: service_healthy
      openmetadata-search:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    networks:
      - lakehouse

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION}
    container_name: lakehouse-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - lakehouse

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: lakehouse-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      TZ: ${TZ}
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - lakehouse

  loki:
    image: grafana/loki:${LOKI_VERSION}
    container_name: lakehouse-loki
    restart: unless-stopped
    user: "0"
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "${LOKI_HOST_PORT}:3100"
    volumes:
      - ./ops/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks:
      - lakehouse

  promtail:
    image: grafana/promtail:${PROMTAIL_VERSION}
    container_name: lakehouse-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./ops/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lakehouse

  # Policy decision point — Trino queries it per-request (serving/access-control.properties)
  opa:
    image: openpolicyagent/opa:${OPA_VERSION}
    container_name: lakehouse-opa
    restart: unless-stopped
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    ports:
      - "${OPA_HOST_PORT}:8181"
    volumes:
      - ./ops/opa/policies:/policies:ro
    networks:
      - lakehouse

  # Single edge entrypoint for every UI (host-name based routing)
  haproxy:
    image: haproxy:${HAPROXY_VERSION}
    container_name: lakehouse-haproxy
    restart: unless-stopped
    ports:
      - "${HAPROXY_HTTP_HOST_PORT}:80"
      - "${HAPROXY_STATS_HOST_PORT}:8404"
    volumes:
      - ./ops/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - lakehouse
